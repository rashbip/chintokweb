<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - চিন্তক Academy</title>
    <link rel="icon" type="image/png" sizes="192x192" href="images/icons/Icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Tiro+Bangla&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Core Styles -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="dark-theme">
    <div class="auth-container">
        <div class="blur-circle blur-circle-1"></div>
        <div class="blur-circle blur-circle-2"></div>

        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html">
                    <img src="images/icons/Icon-192.png" alt="Chintok Logo" class="auth-logo">
                </a>
                <h1 class="auth-title" data-i18n="signup_title">অ্যাকাউন্ট তৈরি করুন</h1>
                <p class="auth-subtitle" data-i18n="signup_subtitle">আজই আপনার শেখার যাত্রা শুরু করুন</p>
            </div>

            <form id="signup-form">
                <div class="form-group">
                    <label class="form-label" for="full-name" data-i18n="label_name">সম্পূর্ণ নাম</label>
                    <div class="input-wrapper">
                        <input type="text" id="full-name" class="form-input" placeholder="আপনার নাম লিখুন" data-i18n-placeholder="placeholder_name" required>
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email" data-i18n="label_email">ইমেইল ঠিকানা</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="form-input" placeholder="example@mail.com" data-i18n-placeholder="placeholder_email" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password" data-i18n="label_password">পাসওয়ার্ড</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                        <i class="fas fa-lock input-icon"></i>
                        <i class="fas fa-eye password-toggle" id="password-toggle"></i>
                    </div>
                    
                    <div class="password-requirements" id="password-requirements">
                        <div class="requirement" id="req-length">
                            <i class="fas fa-circle"></i>
                            <span data-i18n="req_len">৬+ অক্ষর</span>
                        </div>
                        <div class="requirement" id="req-upper">
                            <i class="fas fa-circle"></i>
                            <span data-i18n="req_upper">বড় হাতের (A)</span>
                        </div>
                        <div class="requirement" id="req-lower">
                            <i class="fas fa-circle"></i>
                            <span data-i18n="req_lower">ছোট হাতের (a)</span>
                        </div>
                        <div class="requirement" id="req-number">
                            <i class="fas fa-circle"></i>
                            <span data-i18n="req_num">সংখ্যা (1)</span>
                        </div>
                        <div class="requirement" id="req-special">
                            <i class="fas fa-circle"></i>
                            <span data-i18n="req_spec">বিশেষ চিহ্ন ($)</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-auth" id="signup-btn" disabled data-i18n="btn_signup">সাইন আপ</button>
            </form>

            <div class="separator" data-i18n="or_with">অথবা</div>

            <button class="btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                <span data-i18n="btn_google">গুগল দিয়ে লগইন</span>
            </button>

            <div class="auth-footer-link">
                <span data-i18n="already_have_acc">ইতিমধ্যেই অ্যাকাউন্ট আছে?</span> 
                <a href="login.html" data-i18n="link_login">লগইন করুন</a>
            </div>
        </div>
    </div>

    <!-- Floating Theme/Lang Controls -->
    <div class="floating-controls">
        <button id="theme-toggle" class="theme-toggle" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
        <button id="lang-toggle" class="lang-toggle">
            <i class="fas fa-language"></i> English
        </button>
    </div>

    <!-- Core Scripts -->
    <script src="js/translations.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/ui.js"></script>
    <script src="main.js"></script>
    <script>
        // Wait for DOM to be ready (main.js also runs on DOMContentLoaded)
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('password');
            const signupBtn = document.getElementById('signup-btn');
            const toggleBtn = document.getElementById('password-toggle');
            
            const reqs = {
                length: { el: document.getElementById('req-length'), regex: /.{6,}/ },
                upper: { el: document.getElementById('req-upper'), regex: /[A-Z]/ },
                lower: { el: document.getElementById('req-lower'), regex: /[a-z]/ },
                number: { el: document.getElementById('req-number'), regex: /[0-9]/ },
                special: { el: document.getElementById('req-special'), regex: /[!@#$%^&*(),.?":{}|<>]/ }
            };

            if (passwordInput) {
                passwordInput.addEventListener('input', () => {
                    const val = passwordInput.value;
                    let allValid = true;

                    for (const key in reqs) {
                        const isValid = reqs[key].regex.test(val);
                        const el = reqs[key].el;
                        const icon = el.querySelector('i');

                        if (isValid) {
                            el.classList.remove('invalid');
                            el.classList.add('valid');
                            icon.className = 'fas fa-check-circle';
                        } else {
                            el.classList.remove('valid');
                            if (val.length > 0) el.classList.add('invalid');
                            else el.classList.remove('invalid');
                            icon.className = 'fas fa-circle';
                            allValid = false;
                        }
                    }

                    signupBtn.disabled = !allValid;
                });
            }

            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    const type = passwordInput.type === 'password' ? 'text' : 'password';
                    passwordInput.type = type;
                    toggleBtn.className = type === 'password' ? 'fas fa-eye password-toggle' : 'fas fa-eye-slash password-toggle';
                });
            }
        });
    </script>
</body>
</html>
